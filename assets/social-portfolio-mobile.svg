<svg xmlns="http://www.w3.org/2000/svg" width="180" height="126" viewBox="0 0 180 126" role="img" aria-labelledby="title desc">
<title id="title">Portfolyo</title><desc id="desc">Portfolyo — celikugur.dev. Simge, sitedeki sosyal butonlar gibi sağa yuvarlanır. Bağlantıyı açmak için tıklayın.</desc>
<!-- LinkedIn glyph: Font Awesome Free, Fonticons, Inc., CC BY 4.0. https://fontawesome.com/license/free -->
<defs><clipPath id="bounds"><rect x="1" y="1" width="178" height="124" rx="14"/></clipPath></defs>
<style>
 .wash,.track,.roll,.copy,.arrow {animation-duration:9s;animation-delay:-0s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.3,.75,.2,1)}
 .wash {animation-name:wash;transform-origin:left center}
 .track {animation-name:track}
 .roll {animation-name:roll}
 .copy {animation-name:copy}
 .arrow {animation-name:arrow}
 @keyframes wash {0%,18%,62%,100%{transform:scaleX(0)}27%,52%{transform:scaleX(1)}}
 @keyframes track {0%,18%,62%,100%{transform:translateX(0)}27%,52%{transform:translateX(112px)}}
 @keyframes roll {0%,18%,62%,100%{transform:rotate(0)}27%,52%{transform:rotate(360deg)}}
 @keyframes copy {0%,18%,62%,100%{transform:translateX(0)}27%,52%{transform:translateX(0px)}}
 @keyframes copyFade {0%,18%,27%,52%,62%,100%{opacity:1}20%,25%,54%,60%{opacity:0}}
 @keyframes arrow {0%,18%,62%,100%{opacity:1;transform:translate(0,0)}25%,54%{opacity:0;transform:translate(10px,-10px)}}
 @media(prefers-reduced-motion:reduce){.wash,.track,.roll,.copy,.arrow{animation:none!important}.wash{transform:scaleX(0)}}
</style>
<rect x="1" y="1" width="178" height="124" rx="14" fill="#304355" stroke="#52677D"/>
<g clip-path="url(#bounds)">
 <rect class="wash" x="0" y="0" width="180" height="126" fill="#89652E"/>
 <g transform="translate(34 35)"><g class="track"><circle r="24" fill="#ffffff0a" stroke="#ffffff36"/><g class="roll"><g fill="none" stroke="#fff" stroke-width="2.1"><circle r="17"/><ellipse rx="7.4" ry="17"/><path d="M-16 0 H16 M-14 -8 H14 M-14 8 H14"/></g></g></g></g>
 <g class="copy" fill="#fff" font-family="'Trebuchet MS',Arial,sans-serif">
  <text x="16" y="99" font-size="23" font-weight="700" letter-spacing="-.5">Portfolyo</text>
</g></g></svg>